
name: Build Butterfly Cosmetic

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build project
        run: gradle build

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: ButterflyCosmetic-Fabric
          path: build/libs/*.jar
